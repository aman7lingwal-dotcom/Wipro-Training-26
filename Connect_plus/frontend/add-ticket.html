<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Ticket - ConnectPlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ConnectPlus</a>
            <div>
                <a class="btn btn-outline-light me-2" href="customers.html">Customers</a>
                <a class="btn btn-outline-light me-2" href="tickets.html">Tickets</a>
                <a class="btn btn-outline-light me-2" href="add-customer.html">Add Customer</a>
                <a class="btn btn-outline-light" href="add-ticket.html">Add Ticket</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="container-box">
            <h2>Add Ticket</h2>

            <form onsubmit="submitTicket(event)">
                <div class="mb-3">
                    <label class="form-label">Customer ID</label>
                    <input type="number" id="ticketCustomerId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category ID</label>
                    <input type="number" id="ticketCategoryId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Agent ID</label>
                    <input type="number" id="ticketAgentId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status ID</label>
                    <input type="number" id="ticketStatusId" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="ticketDescription" class="form-control" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Ticket</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
