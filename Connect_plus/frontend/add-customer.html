<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - ConnectPlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">ConnectPlus</a>
            <div>
                <a class="btn btn-outline-light me-2" href="customers.html">Customers</a>
                <a class="btn btn-outline-light me-2" href="tickets.html">Tickets</a>
                <a class="btn btn-outline-light me-2" href="add-customer.html">Add Customer</a>
                <a class="btn btn-outline-light" href="add-ticket.html">Add Ticket</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="container-box">
            <h2>Add Customer</h2>

            <form onsubmit="submitCustomer(event)">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" id="customerName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="customerEmail" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" id="customerPhone" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Customer</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
